# Its own workspace on purpose: `[workspace]` at the bottom detaches this
# crate from the repo root, so `cargo build --workspace` never sees it and the
# nightly toolchain libFuzzer needs stays off everyone else's build path. Same
# pattern as `crates/proto/fuzz`.

[package]
name = "agntcy-slim-config-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Imported as `slim_config` (the lib name), so machete cannot match the
# `agntcy-slim-config` dependency key. Not covered by the root ignore list
# because this crate is its own workspace.
[package.metadata.cargo-machete]
ignored = ["agntcy-slim-config"]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.agntcy-slim-config]
path = ".."

[[bin]]
name = "websocket-endpoint-parse"
path = "fuzz_targets/websocket-endpoint-parse.rs"
test = false
doc = false
bench = false

[workspace]
