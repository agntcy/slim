apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "channel-manager.fullname" . }}
  labels:
    {{- include "channel-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "channel-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "channel-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "channel-manager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          command:
            - "/channel-manager"
          args:
            - "--config-file"
            - "/config.yaml"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $envVars := .Values.extraEnv | default list }}
          {{- if and .Values.persistence.enabled (not .Values.persistence.insecure) .Values.persistence.encryptionPassphrase.secretRef.name }}
          {{- $envVars = append $envVars (dict "name" "CM_PASSPHRASE" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.persistence.encryptionPassphrase.secretRef.name "key" .Values.persistence.encryptionPassphrase.secretRef.key))) }}
          {{- end }}
          {{- if $envVars }}
          env:
            {{- toYaml $envVars | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /config.yaml
              subPath: config.yaml
            {{- if .Values.persistence.enabled }}
            - name: slim-store
              mountPath: {{ .Values.persistence.path.value }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "channel-manager.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: slim-store
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "channel-manager.fullname" .) }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
