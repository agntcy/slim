apiVersion: v1
kind: Service
metadata:
  name: {{ include "control-plane.fullname" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- /* One Service port per configured control-plane listener. */}}
    {{- range $p := (include "control-plane.listenerPorts" (dict "bound" .Values.service.north "prefix" "north") | fromYamlArray) }}
    - port: {{ $p.port }}
      targetPort: {{ $p.name }}
      protocol: TCP
      name: {{ $p.name }}
    {{- end }}
    {{- range $p := (include "control-plane.listenerPorts" (dict "bound" .Values.service.south "prefix" "south") | fromYamlArray) }}
    - port: {{ $p.port }}
      targetPort: {{ $p.name }}
      protocol: TCP
      name: {{ $p.name }}
    {{- end }}
  selector:
    {{- include "control-plane.selectorLabels" . | nindent 4 }}
