#
# Reusable docs pipeline for https://agntcy.github.io/slim/. Provisions tools
# (uv, task, lychee) and calls task entries from docs/Taskfile.yml. All build,
# lint, and deploy logic lives in the Taskfile; this only wires it to CI.
#
# Deploy-only (called by docs-deploy.yml). PR checks live in docs-ci.yaml: this
# job needs contents: write, and a read-only caller can't call it at all.
#
# Behavior by `mode`:
#   deploy-dev     -> build + lint, then docs:deploy:dev (`dev` version) + docs:deploy:root-files
#   deploy-release -> docs:deploy:release VERSION=<v> + docs:deploy:root-files

name: Reusable Docs

on:
  workflow_call:
    inputs:
      mode:
        description: "deploy-dev | deploy-release"
        required: true
        type: string
      version:
        description: "Raw version label for deploy-release (leading v stripped by the task)"
        required: false
        type: string
        default: ""

# Top level stays read-only per least-privilege best practice; the job below
# declares the write permission it actually needs (mike --push). A called
# workflow can't be granted more than its caller allows, so the caller must
# grant contents: write too.
permissions:
  contents: read

jobs:
  docs:
    name: Docs (${{ inputs.mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # mike needs full history and the gh-pages branch to deploy versions.
          fetch-depth: 0
          # Keep checkout credentials for mike --push in deploy modes.
          persist-credentials: true

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Setup task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install lychee (link checker)
        if: inputs.mode == 'deploy-dev'
        shell: bash
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xzv
          sudo mv lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          lychee --version

      - name: CI checks (build + lint)
        if: inputs.mode == 'deploy-dev'
        shell: bash
        run: task docs:ci

      - name: Deploy dev
        if: inputs.mode == 'deploy-dev'
        shell: bash
        run: task docs:deploy:dev

      - name: Deploy release version + latest
        if: inputs.mode == 'deploy-release'
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: task docs:deploy:release VERSION="${VERSION_INPUT}"

      - name: Deploy root-level files (404/robots/llms)
        if: inputs.mode == 'deploy-dev' || inputs.mode == 'deploy-release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: task docs:deploy:root-files
