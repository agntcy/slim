---
name: benchmark

# Runs nightly (via ci-nightly, which calls this workflow) and on manual
# dispatch. Not a PR gate: there is no regression comparison, so per-PR runs
# produced no actionable signal while costing a runner on every PR.
on:
  workflow_call:
    inputs:
      senders:
        description: 'Comma-separated sender counts'
        required: false
        default: '1,2,4,8'
        type: string
      messages:
        description: 'Messages per sender'
        required: false
        default: '1000000'
        type: string
      payload-sizes:
        description: 'Comma-separated payload sizes in bytes'
        required: false
        default: '8,16,64,256,1024,4096'
        type: string
      runs:
        description: 'Repetitions per configuration'
        required: false
        default: '3'
        type: string
  workflow_dispatch:
    inputs:
      senders:
        description: 'Comma-separated sender counts'
        required: false
        default: '1,2,4,8'
        type: string
      messages:
        description: 'Messages per sender'
        required: false
        default: '1000000'
        type: string
      payload-sizes:
        description: 'Comma-separated payload sizes in bytes'
        required: false
        default: '8,16,64,256,1024,4096'
        type: string
      runs:
        description: 'Repetitions per configuration'
        required: false
        default: '3'
        type: string

permissions: {}

jobs:
  benchmark:
    name: Data plane benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Run benchmark
        working-directory: .
        env:
          BENCH_SENDERS: ${{ inputs.senders || '1,2,4,8' }}
          BENCH_MESSAGES: ${{ inputs.messages || '500000' }}
          BENCH_PAYLOAD_SIZES: ${{ inputs.payload-sizes || '8,16,64,1024' }}
          BENCH_RUNS: ${{ inputs.runs || '1' }}
        run: |
          ./scripts/run-benchmark.sh \
            --senders "$BENCH_SENDERS" \
            --messages "$BENCH_MESSAGES" \
            --payload-sizes "$BENCH_PAYLOAD_SIZES" \
            --runs "$BENCH_RUNS" \
            --output benchmark-results.csv

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results.csv
          retention-days: 90
