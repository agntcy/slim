---
name: ci-release-rust

on:
  push:
    branches:
      - main

jobs:
  # Release unpublished packages.
  release-crates:
    name: Release slim crates
    runs-on: ubuntu-latest
    # Scope the publish/token secrets to a dedicated environment (zizmor
    # secrets-outside-env); add protection rules to it in repo settings as needed.
    environment: release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.AGNTCY_BUILD_BOT_GH_TOKEN }}
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          manifest_path: ./Cargo.toml
          config: ./.release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.AGNTCY_BUILD_BOT_GH_TOKEN }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-crates-pr:
    name: Release slim crates - PR
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          manifest_path: ./Cargo.toml
          config: ./.release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.AGNTCY_BUILD_BOT_GH_TOKEN }}
