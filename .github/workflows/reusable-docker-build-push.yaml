---
name: reusable-docker-build-push

on:
  workflow_call:
    inputs:
      bake-targets:
        required: true
        type: string
        description: "Bake target"
      bake-file:
        required: false
        type: string
        description: "Bake file"
        default: "docker-bake.hcl"
      image-tag:
        required: true
        type: string
        description: "Image tag to use."
      image-repo:
        required: false
        type: string
        description: "Image repo to use."
        default: "ghcr.io/agntcy/slim"
      ref:
        required: false
        type: string
        description: "Git ref to build. Defaults to the ref that triggered the caller."
        default: ""
      push:
        required: false
        type: boolean
        description: "Log in to the registry and push the images."
        default: false
      latest:
        required: false
        type: boolean
        description: "Also tag the images as latest (only with push)."
        default: false

# Grants live on the job below, next to the steps that need them. A top-level
# block here is the whole list for a reusable workflow: every scope it leaves
# out becomes `none`, however much the caller grants. That is how #2032 -- which
# added `contents: read` here and nothing else -- dropped `packages: write` and
# broke the slim-v3.0.0 and slim-v3.0.1 image pushes. Keep this empty, and keep
# the real grants on the job.
permissions: {}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Disk cleanup
        uses: ./.github/actions/cleanup-disk

      - name: Login to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # A reusable workflow gets GITHUB_TOKEN with the grants of the job
          # that called it, so there is nothing to hand over: `packages: write`
          # on the caller's job is what makes this token able to push.
          password: ${{ github.token }}

      - name: Check available disk space
        run: df -h

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        with:
          path: cache-mount
          key: cache-mount-${{ hashFiles('Dockerfile') }}

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          tags: |
            type=raw,value=${{ inputs.image-tag }}
            type=raw,value=latest,enable=${{ inputs.push && inputs.latest }}

      - name: Build and push
        id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: |
            ${{ inputs.bake-file }}
            ${{ steps.metadata.outputs.bake-file }}
          targets: ${{ inputs.bake-targets }}
          push: ${{ inputs.push }}
          provenance: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min
        env:
          IMAGE_REPO: ${{ inputs.image-repo }}

      # Read every pushed tag back from the registry, so a release cannot end
      # green without the images actually being pullable.
      - name: Verify pushed images
        if: ${{ inputs.push }}
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          mapfile -t images < <(jq -r '.[] | objects | ."image.name" // empty | split(",")[]' <<<"$BAKE_METADATA")
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::bake reported no pushed images"
            exit 1
          fi
          for image in "${images[@]}"; do
            echo "Checking ${image}"
            docker buildx imagetools inspect "$image" >/dev/null
          done
