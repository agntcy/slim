#
# Docs deploys via the reusable docs pipeline:
#   - push to main                -> mode deploy-dev      (`dev` version; never `latest`)
#   - release slim-vX.Y.Z         -> mode deploy-release  (`slim-vX.Y.Z` + `latest`, default)
#   - any other release           -> skipped
#   - workflow_dispatch           -> mode deploy-release, version from input
#
# This monorepo publishes a GitHub release for every component (slimctl,
# slim-config, helm-slim, ...). Only final releases of the SLIM node (tags
# slim-vX.Y.Z, not slim-version-* and not pre-releases) are docs versions;
# deploying the others would add them to the version picker and move `latest`.
#
# gh-pages is the version ledger (mike --push). Event parsing lives here (needs
# the GitHub event context); the mike/task mechanics live in docs/Taskfile.yml.

name: Documentation Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Docs version label for mike (e.g. 1.2.0; no leading v required)'
        required: true
        type: string

permissions:
  contents: read

# Serialize gh-pages updates so concurrent mike pushes do not race.
concurrency:
  group: docs-deploy-pages
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deploy mode + version
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - name: Resolve mode and version
        id: r
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          MODE=""
          VERSION=""
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
            MODE="deploy-dev"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            MODE="deploy-release"
            VERSION="${INPUT_VERSION}"
          elif [ "${EVENT_NAME}" = "release" ]; then
            if [[ "${RELEASE_TAG:-}" =~ ^slim-v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "${RELEASE_PRERELEASE}" != "true" ]; then
              MODE="deploy-release"
              VERSION="${RELEASE_TAG}"
            else
              MODE="skip"
              echo "Release ${RELEASE_TAG:-<none>} is not a final SLIM node release (slim-vX.Y.Z); not deploying docs."
            fi
          else
            echo "::error::Could not resolve deploy mode from event ${EVENT_NAME} (${REF})"
            exit 1
          fi
          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved mode=${MODE} version=${VERSION:-<none>}"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.mode != 'skip'
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-docs.yml
    secrets:
      PROJECT_APP_ID: ${{ secrets.PROJECT_APP_ID }}
      PROJECT_APP_KEY: ${{ secrets.PROJECT_APP_KEY }}
    with:
      mode: ${{ needs.resolve.outputs.mode }}
      version: ${{ needs.resolve.outputs.version }}
