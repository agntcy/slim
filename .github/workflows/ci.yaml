---
name: ci-build-and-test

# Deliberately NOT path-filtered here. A check whose workflow never triggers
# never reports a conclusion, which leaves any PR that requires it pending for
# ever; a job skipped by its own `if:` reports `skipped`, which satisfies a
# required check. Filtering therefore happens in the `changes` job below, which
# applies exactly the path set that used to live here.
on:
  # Required checks must report on queue entries too, or every entry waits for
  # a conclusion that never arrives. Harmless until a merge queue exists.
  merge_group:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Filtering lives here rather than in `on:` because a check whose workflow
  # never triggers never reports a conclusion, so a pull request that requires
  # it stays pending for ever. A job skipped by its own `if:` does report.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes that affect the Rust workspace
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) from=$PR_BASE; to=$PR_HEAD ;;
            push)         from=$PUSH_BEFORE; to=$PUSH_AFTER ;;
            # A merge group tests the tree that will land; a dispatch is explicit.
            *) echo "workspace=true" >>"$GITHUB_OUTPUT"; exit 0 ;;
          esac
          changed=$(git diff --name-only "$from" "$to" 2>/dev/null)
          # An empty or failed diff (including a new branch's all-zero SHA)
          # means we cannot tell: build rather than skip.
          if [ -z "$changed" ]; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          # Exclusion, not inclusion: a path nobody thought about should build.
          if printf '%s\n' "$changed" | grep -qvE '(^docs/|^charts/|\.md$|^\.github/ISSUE_TEMPLATE/)'; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"
          else
            echo "workspace=false" >>"$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & test
    needs: [changes]
    # No `if:` here on purpose. Skipping a `uses:` job means the called
    # workflow's jobs never exist, so `Build & test / *` reports nothing at all
    # and a required check waits for ever — a job-level skip only reports
    # `skipped` for a normal job. Gate the work through the inputs instead:
    # each child job still exists and reports `skipped` when its flag is false.
    uses: ./.github/workflows/reusable-rust-build-and-test.yaml
    with:
      rust-lint: ${{ needs.changes.outputs.workspace == 'true' }}
      rust-test: ${{ needs.changes.outputs.workspace == 'true' }}
      rust-cross-build: ${{ needs.changes.outputs.workspace == 'true' }}
      # wasm unit-test suite runs on PRs so wasm32 compile regressions are
      # caught early; the browser suite (headless Chrome) stays nightly-only.
      rust-test-wasm: ${{ needs.changes.outputs.workspace == 'true' }}
      rust-test-wasm-browser: false

  windows-build:
    name: Build (Windows)
    needs: [changes]
    # Run only on pushes to main, not on PRs, and only when the workspace
    # actually changed -- the `on:` filter used to imply the latter.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.workspace == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: "-windows-x86_64-debug"

      - name: Build
        run: cargo build --locked --all-targets

  docker-build:
    name: Build SLIM docker image
    uses: ./.github/workflows/reusable-docker-build-push.yaml
    needs: [changes]
    # Run only on pushes to main, not on PRs, and only when the workspace
    # actually changed -- the `on:` filter used to imply the latter.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.workspace == 'true'
    with:
      bake-targets: slim
      image-tag: ${{ github.sha }}
