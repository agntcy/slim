---
name: ci-build-and-test

on:
  push:
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/reusable-rust-build-and-test.yaml'
      - '.github/workflows/reusable-docker-build-push.yaml'
      - '.github/actions/setup-rust/action.yaml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Taskfile.yaml'
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/reusable-rust-build-and-test.yaml'
      - '.github/workflows/reusable-docker-build-push.yaml'
      - '.github/actions/setup-rust/action.yaml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Taskfile.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & test
    uses: ./.github/workflows/reusable-rust-build-and-test.yaml
    with:
      # wasm unit-test suite runs on PRs so wasm32 compile regressions are
      # caught early; the browser suite (headless Chrome) stays nightly-only.
      rust-test-wasm: true
      rust-test-wasm-browser: false

  windows-build:
    name: Build (Windows)
    # Run only on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: "-windows-x86_64-debug"

      - name: Build
        run: cargo build --locked --all-targets

  docker-build:
    name: Build SLIM docker image
    uses: ./.github/workflows/reusable-docker-build-push.yaml
    # Run only on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    with:
      bake-targets: slim
      image-tag: ${{ github.sha }}
