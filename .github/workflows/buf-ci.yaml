---
name: ci-buf
on:
  push:
    paths:
      # Caution: This workflow could miss changes if the paths are not correctly specified.
      - "**.proto"
      - "**/buf.yaml"
      - "**/buf.lock"
      - "**/buf.md"
      - "**/README.md"
      - "**/LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      # Keep PR trigger aligned with push trigger to avoid running on docs-only changes.
      - "**.proto"
      - "**/buf.yaml"
      - "**/buf.lock"
      - "**/buf.md"
      - "**/README.md"
      - "**/LICENSE"
      - ".github/workflows/buf-ci.yaml"
  delete:
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          token: ${{ secrets.BUF_TOKEN }}
          breaking_against: buf.build/agntcy/slim
